<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkwell · Teacher</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='10' fill='%238a2c37'/%3E%3Cpath d='M13 29c3-1 5-4 7-8l5-10c.6-1.3 2.4-.9 2.4.5 0 4-2.7 9.6-6.4 13.3-2.1 2.1-4.6 3.5-8 4.2Z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <section id="t-login" class="center-screen" hidden>
    <div class="card login-card">
      <div class="brand"><span data-icon="mark"></span>Inkwell <small>Teacher</small></div>
      <p class="lede">Sign in to see your classes live.</p>
      <form id="t-login-form">
        <label class="sr-only" for="t-pw">Password</label>
        <input id="t-pw" type="password" class="input" placeholder="Teacher password" autocomplete="current-password" required style="text-align:center;font-size:17px;padding:13px">
        <button class="btn primary lg" id="t-login-btn" type="submit">Sign in</button>
        <div class="err" id="t-login-err"></div>
      </form>
      <div class="login-foot">Student? <a href="./">Go to the student page</a></div>
    </div>
  </section>

  <section id="t-app" hidden>
    <header class="t-top">
      <div class="brand"><span data-icon="mark"></span>Inkwell</div>
      <nav class="tabs" id="tabs">
        <button class="tab on" data-tab="live">Live <span class="count" id="lock-count" hidden>0</span></button>
        <button class="tab" data-tab="assignments">Assignments</button>
        <button class="tab" data-tab="classes">Classes &amp; students</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>
      <div class="spacer"></div>
      <button class="btn sm ghost" id="t-logout">Sign out</button>
    </header>
    <main class="t-main" id="t-main"></main>
  </section>

  <div id="toasts"></div>
  <script src="js/config.js?v=1"></script>
  <script src="js/common.js?v=1"></script>
  <script src="js/editor.js?v=1"></script>
  <script src="js/teacher.js?v=1"></script>
</body>
</html>
